openapi: 3.2.0
info:
  title: PumsemKitchen - Backend-API
  version: 0.0.1
paths:
  /auth/login:
    post:
      summary: Вход пользователя
      description: >
        Принимает логин и пароль. Проверяет наличие пользователя в БД и корректность пароля.
        После успешного входа устанавливает сессионную cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginData"
      responses:
        "200":
          description: Вход выполнен, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Неверный логин или пароль
        "422":
          description: Ошибка валидации входных данных
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      description: >
        Принимает логин, пароль и пригласительный код.
        Роль определяется по коду: INVITE_CODE → user, INVITE_CODE_ADMIN → admin.
        После успешной регистрации устанавливает сессионную cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterData"
      responses:
        "200":
          description: Пользователь зарегистрирован, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Неверный пригласительный код
        "409":
          description: Пользователь с таким логином уже существует
        "422":
          description: Ошибка валидации входных данных
  /products/public:
    get:
      summary: Список публичных продуктов
      description: >
        Возвращает все продукты с флагом is_public = true.
        Не требует авторизации. isOwn всегда false.
      responses:
        "200":
          description: Массив публичных продуктов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
  /products:
    get:
      summary: Список продуктов пользователя
      description: >
        Возвращает все продукты, принадлежащие аутентифицированному пользователю (isOwn: true).
        Включает measurementUnitId.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Массив продуктов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
    post:
      summary: Создать продукт
      description: >
        Создаёт новый продукт для аутентифицированного пользователя.
        Поля g_measure, ml_measure, pcs_measure хранятся прямо в таблице products.
        Если передан ml_measure или pcs_measure, поле g_measure обязательно.
        Возвращает measurementUnitId.
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Продукт создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "422":
          description: Ошибка валидации входных данных
  /products/{id}:
    get:
      summary: Получить продукт по ID
      description: >
        Возвращает продукт по его ID вместе с мерами конвертации.
        Пользователь может получить только свой продукт.
        measurementUnitId в ответе отсутствует.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      responses:
        "200":
          description: Данные продукта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к продукту
        "404":
          description: Продукт не найден
    patch:
      summary: Обновить продукт
      description: >
        Обновляет данные существующего продукта.
        Поля g_measure, ml_measure, pcs_measure хранятся прямо в таблице products.
        Если ml_measure или pcs_measure передан как null, а продукт используется хотя бы в одном рецепте — запрос отклоняется с 422.
        Возвращает measurementUnitId.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Продукт обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Продукт не найден
        "422":
          description: Ошибка валидации или попытка обнулить меры у продукта из рецептов
    delete:
      summary: Удалить продукт
      description: >
        Удаляет продукт по его ID. Пользователь может удалить только свой продукт.
        Если продукт используется как ингредиент хотя бы в одном рецепте, удаление отклоняется.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      responses:
        "200":
          description: Продукт удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Продукт успешно удалён
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к продукту
        "404":
          description: Продукт не найден
        "409":
          description: Продукт используется в рецептах и не может быть удалён
  /recipes:
    get:
      summary: Список рецептов пользователя
      description: >
        Возвращает все рецепты, принадлежащие аутентифицированному пользователю.
        Сортировка по убыванию даты создания.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Массив рецептов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "401":
          description: Пользователь не авторизован
    post:
      summary: Создать рецепт
      description: >
        Создаёт новый рецепт с ингредиентами и шагами приготовления.
        Все три таблицы (recipes, ingredients, recipe_steps) заполняются атомарно в рамках одной транзакции.
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeData"
      responses:
        "200":
          description: Созданный рецепт с полными данными
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "422":
          description: Ошибка валидации входных данных
  /recipes/{id}:
    patch:
      summary: Обновить рецепт
      description: >
        Частично обновляет рецепт. Если переданы ingredients или steps — они заменяются целиком.
        Пользователь может редактировать только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeData"
      responses:
        "200":
          description: Обновлённый рецепт с полными данными
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
        "422":
          description: Ошибка валидации входных данных
    get:
      summary: Получить рецепт по ID
      description: >
        Возвращает полные данные рецепта: основную информацию, ингредиенты и шаги приготовления.
        Пользователь может получить только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Полные данные рецепта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
    delete:
      summary: Удалить рецепт
      description: >
        Удаляет рецепт по ID. Каскадно удаляет ингредиенты, шаги, оценки и связи с коллекциями.
        Пользователь может удалить только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Рецепт успешно удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
  /recipes/{id}/shopping-list:
    post:
      summary: Сформировать список покупок из рецепта
      description: >
        Создаёт новый список покупок на основе ингредиентов рецепта с учётом указанного числа порций.
        Выполняет масштабирование количеств, конвертацию volume_extra → volume,
        а также объединение дублирующихся продуктов в граммах.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - portions
              properties:
                portions:
                  type: integer
                  minimum: 1
                  description: Количество порций, на которое формируется список
      responses:
        "200":
          description: Созданный список покупок
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID нового списка покупок
                  title:
                    type: string
                    description: Заголовок нового списка покупок
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
        "422":
          description: Ошибка валидации входных данных
  /users/me:
    get:
      summary: Профиль текущего пользователя
      description: >
        Возвращает логин и отображаемое имя аутентифицированного пользователя.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Данные текущего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
    patch:
      summary: Обновить имя текущего пользователя
      description: >
        Обновляет отображаемое имя аутентифицированного пользователя.
        Имя не должно превышать 32 символа и содержать спецсимволы, кроме «-».
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserMe"
      responses:
        "200":
          description: Обновлённые данные пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
        "422":
          description: Ошибка валидации входных данных
    delete:
      summary: Удалить аккаунт текущего пользователя
      description: >
        Удаляет аутентифицированного пользователя из системы и очищает сессию.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Аккаунт успешно удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Пользователь не авторизован
  /users/me/password:
    patch:
      summary: Сменить пароль текущего пользователя
      description: >
        Проверяет совпадение currentPassword с паролем из БД.
        При совпадении заменяет пароль на newPassword (bcrypt, 10 раундов).
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordData"
      responses:
        "200":
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Текущий пароль введён неверно
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
        "422":
          description: Ошибка валидации входных данных
  /measurements:
    get:
      summary: Список единиц измерения
      description: Возвращает все доступные единицы измерения из справочника.
      responses:
        "200":
          description: Список единиц измерения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementUnit"
        "401":
          description: Не авторизован
  /auth/logout:
    post:
      summary: Выход пользователя
      description: Очищает сессионную cookie на сервере.
      responses:
        "200":
          description: Сессия очищена
        "401":
          description: Нет активной сессии
  /menus:
    get:
      summary: Список меню текущего пользователя
      description: Возвращает все меню, созданные текущим пользователем, с датами периода.
      responses:
        "200":
          description: Массив меню
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuResponse"
        "401":
          description: Не авторизован
    post:
      summary: Создание нового меню
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuForm"
      responses:
        "200":
          description: Созданное меню
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "401":
          description: Не авторизован
        "422":
          description: Ошибка валидации
  /menus/{id}:
    patch:
      summary: Обновление меню
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuForm"
      responses:
        "200":
          description: Обновлённое меню
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню не найдено
        "422":
          description: Ошибка валидации
    delete:
      summary: Удаление меню
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Меню удалено
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню не найдено
  /menus/{id}/plan-dates:
    get:
      summary: Список дней меню
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Название меню и список дней
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuTitle:
                    type: string
                  planDates:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlanDateResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню не найдено
    post:
      summary: Добавить день в меню
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDateForm"
      responses:
        "200":
          description: Созданный день
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDateResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню не найдено
        "409":
          description: Этот день уже добавлен в меню
        "422":
          description: Ошибка валидации
  /menus/{id}/plan-dates/{planDateId}:
    patch:
      summary: Изменить дату дня
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: planDateId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDateForm"
      responses:
        "200":
          description: Обновлённый день
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDateResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню или день не найден
        "409":
          description: Этот день уже добавлен в меню
        "422":
          description: Ошибка валидации
    delete:
      summary: Удалить день из меню
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: planDateId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: День удалён
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню или день не найден
  /menus/{id}/days/{date}:
    get:
      summary: Содержимое дня меню
      description: Возвращает приёмы пищи с рецептами для указанной даты в меню.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Детали дня
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayDetailResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа к меню
        "404":
          description: Меню или дата не найдены
  /meals/{mealId}/recipes/{recipeId}:
    patch:
      summary: Изменить количество порций рецепта в приёме пищи
      parameters:
        - in: path
          name: mealId
          required: true
          schema:
            type: integer
        - in: path
          name: recipeId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealRecipeForm"
      responses:
        "200":
          description: Обновлённая связь рецепта с приёмом пищи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealRecipeResponse"
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа
        "404":
          description: Приём пищи или рецепт не найден
        "422":
          description: Ошибка валидации
    delete:
      summary: Удалить рецепт из приёма пищи
      parameters:
        - in: path
          name: mealId
          required: true
          schema:
            type: integer
        - in: path
          name: recipeId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Рецепт удалён
        "401":
          description: Не авторизован
        "403":
          description: Нет доступа
        "404":
          description: Приём пищи или рецепт не найден
  /converts:
    get:
      summary: Справочник коэффициентов конвертации единиц измерения
      description: >
        Возвращает все записи таблицы converts: пары единиц измерения с коэффициентом конвертации.
        Используется на клиенте для расчёта стоимости ингредиентов.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Массив правил конвертации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convert"
        "401":
          description: Пользователь не авторизован
  /shopping-lists:
    get:
      summary: Получить списки покупок
      description: Возвращает все списки покупок текущего пользователя, отсортированные по дате создания (новые первыми).
      responses:
        "200":
          description: Массив списков покупок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingListResponse"
        "401":
          description: Пользователь не авторизован
    post:
      summary: Создать список покупок
      description: Создаёт новый список покупок для текущего пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShoppingListRequest"
      responses:
        "200":
          description: Список создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListResponse"
        "401":
          description: Пользователь не авторизован
        "422":
          description: Ошибка валидации входных данных
  /shopping-lists/{id}:
    patch:
      summary: Переименовать список покупок
      description: Обновляет название списка покупок. Доступно только владельцу списка.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID списка покупок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingListRequest"
      responses:
        "200":
          description: Список обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListResponse"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к списку
        "404":
          description: Список не найден
        "422":
          description: Ошибка валидации входных данных
    delete:
      summary: Удалить список покупок
      description: Удаляет список покупок. Доступно только владельцу списка.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID списка покупок
      responses:
        "200":
          description: Список удалён
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к списку
        "404":
          description: Список не найден
components:
  schemas:
    ShoppingListResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID списка покупок
        title:
          type: string
          description: Название списка
        authorName:
          type: string
          description: Отображаемое имя автора
        createdAt:
          type: string
          description: Дата создания в формате DD.MM.YYYY
        editorName:
          type: string
          nullable: true
          description: Отображаемое имя последнего редактора (null — список не редактировался)
        editedAt:
          type: string
          description: Дата последнего изменения в формате DD.MM.YYYY
    CreateShoppingListRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Название нового списка покупок
    UpdateShoppingListRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Новое название списка покупок
    Convert:
      type: object
      properties:
        fromUnitId:
          type: integer
          description: ID исходной единицы измерения
        toUnitId:
          type: integer
          description: ID целевой единицы измерения
        coefficient:
          type: number
          description: Коэффициент конвертации (fromUnit * coefficient = toUnit)
      required:
        - fromUnitId
        - toUnitId
        - coefficient
    MenuForm:
      type: object
      required:
        - title
        - dateFrom
        - dateTo
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Название меню
        dateFrom:
          type: string
          format: date
          description: Дата начала периода меню (YYYY-MM-DD)
        dateTo:
          type: string
          format: date
          description: Дата окончания периода меню (YYYY-MM-DD)
    MenuResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID меню
        title:
          type: string
          description: Название меню
        authorName:
          type: string
          description: Имя автора
        createdAt:
          type: string
          format: date
          description: Дата создания
        editedAt:
          type: string
          format: date
          description: Дата последнего редактирования
        editorName:
          type: string
          nullable: true
          description: Имя последнего редактора
        dateFrom:
          type: string
          format: date
          nullable: true
          description: Дата начала периода (min из plan_dates)
        dateTo:
          type: string
          format: date
          nullable: true
          description: Дата окончания периода (max из plan_dates)
        estimatedCost:
          type: number
          nullable: true
          description: Примерная стоимость меню в рублях (всегда null — не реализовано)
    UpdateMealRecipeForm:
      type: object
      required:
        - portions
      properties:
        portions:
          type: integer
          minimum: 1
          description: Количество порций
    MealRecipeResponse:
      type: object
      properties:
        recipeId:
          type: integer
        mealId:
          type: integer
        portions:
          type: integer
    DayDetailResponse:
      type: object
      properties:
        menuTitle:
          type: string
        planDate:
          type: string
          format: date
        meals:
          type: array
          items:
            type: object
            properties:
              mealId:
                type: integer
              mealTitle:
                type: string
              mealOrder:
                type: integer
              recipes:
                type: array
                items:
                  type: object
                  properties:
                    recipeId:
                      type: integer
                    title:
                      type: string
                    portions:
                      type: integer
                    cookingTimeMin:
                      type: integer
                      nullable: true
                    pictureUrl:
                      type: string
                      nullable: true
    PlanDateForm:
      type: object
      required:
        - planDate
      properties:
        planDate:
          type: string
          format: date
          description: Дата дня (YYYY-MM-DD)
    PlanDateResponse:
      type: object
      properties:
        planDateId:
          type: integer
        planDate:
          type: string
          format: date
          description: Дата дня (YYYY-MM-DD)
    LoginData:
      type: object
      required:
        - login
        - password
      properties:
        login:
          description: Логин пользователя (5–32 символа, только латинские буквы и цифры)
          type: string
          minLength: 5
          maxLength: 32
        password:
          description: Пароль пользователя (8–1024 символа)
          type: string
          minLength: 8
          maxLength: 1024
    UserResponse:
      type: object
      properties:
        userId:
          type: integer
        login:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
    RegisterData:
      type: object
      required:
        - login
        - password
        - inviteCode
      properties:
        login:
          description: Логин пользователя (5–32 символа, только латинские буквы и цифры)
          type: string
          minLength: 5
          maxLength: 32
        password:
          description: Пароль пользователя (8–1024 символа)
          type: string
          minLength: 8
          maxLength: 1024
        inviteCode:
          description: Пригласительный код (только буквы и цифры)
          type: string
    RegisterResponse:
      type: object
      properties:
        userId:
          type: integer
        login:
          type: string
        role:
          type: string
          enum: [user, admin]
    MeasurementUnit:
      type: object
      required: [measurement_unit_id, unit_name]
      properties:
        measurement_unit_id:
          type: integer
        unit_name:
          type: string
        unit_abbr:
          type: string
        measure_type:
          type: string
          enum: [piece, weight, volume]
        is_standart:
          type: boolean
    CreateProductRequest:
      type: object
      required:
        - title
        - proteins
        - fats
        - carbs
        - price
        - quantity_per_price
        - measurement_unit_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Название продукта
        proteins:
          type: number
          minimum: 0
          description: Белки на 100 г
        fats:
          type: number
          minimum: 0
          description: Жиры на 100 г
        carbs:
          type: number
          minimum: 0
          description: Углеводы на 100 г
        price:
          type: number
          minimum: 0
          description: Стоимость продукта
        quantity_per_price:
          type: number
          exclusiveMinimum: 0
          description: Количество единиц, за которое указана цена
        measurement_unit_id:
          type: integer
          description: ID единицы измерения из справочника
        family_id:
          type: integer
          description: ID семьи, которой принадлежит продукт. Если не указан — продукт принадлежит только пользователю
        g_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Масса в граммах как базовая единица пропорций. Обязательно, если передан ml_measure или pcs_measure
        ml_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Объём в миллилитрах, соответствующий g_measure граммам
        pcs_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Количество штук, соответствующее g_measure граммам
        is_public:
          type: boolean
          default: false
          description: Доступен ли продукт другим пользователям
    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 32
        description:
          type: string
          nullable: true
        cookingTimeMin:
          type: integer
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          description: Количество порций
        isPublic:
          type: boolean
          description: Доступен ли рецепт другим пользователям
        pictureUrl:
          type: string
          nullable: true
          description: URL изображения рецепта
        sourceUrl:
          type: string
          nullable: true
          description: Ссылка на источник рецепта
        createdAt:
          type: string
          format: date
        editedAt:
          type: string
          format: date
        authorName:
          type: string
          description: Имя владельца рецепта
    RecipeIngredient:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
          description: ID продукта
        name:
          type: string
          description: Название продукта
        note:
          type: string
          nullable: true
          description: Примечание к ингредиенту
        isOptional:
          type: boolean
          description: Является ли ингредиент необязательным
        amount:
          type: number
          description: Количество
        measurementUnitId:
          type: integer
          description: ID единицы измерения
        amountType:
          type: string
          description: Единица измерения
    RecipeStep:
      type: object
      properties:
        step:
          type: number
          description: Порядковый номер шага
        description:
          type: string
          description: Описание шага
        pictureUrl:
          type: string
          nullable: true
          description: URL изображения шага
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/Recipe"
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/RecipeIngredient"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/RecipeStep"
    CreateRecipeIngredientData:
      type: object
      required:
        - product_id
        - measurement_unit_id
        - quantity
      properties:
        product_id:
          type: integer
          description: ID продукта
        measurement_unit_id:
          type: integer
          description: ID единицы измерения
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Количество
        is_optional:
          type: boolean
          description: Необязательный ингредиент
        note:
          type: string
          maxLength: 128
          nullable: true
          description: Примечание к ингредиенту
    CreateRecipeStepData:
      type: object
      required:
        - order
        - description
      properties:
        order:
          type: integer
          exclusiveMinimum: 0
          description: Порядковый номер шага
        description:
          type: string
          minLength: 1
          description: Описание шага
        picture_url:
          type: string
          nullable: true
          description: URL изображения шага
    UpdateRecipeData:
      type: object
      description: Все поля опциональны. Переданные ingredients/steps заменяют существующие целиком.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 32
          description: Название рецепта
        description:
          type: string
          nullable: true
          description: Описание рецепта
        cooking_time_min:
          type: integer
          exclusiveMinimum: 0
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          minimum: 0
          description: Количество порций
        is_public:
          type: boolean
          description: Публичный рецепт
        picture_url:
          type: string
          nullable: true
          description: URL изображения рецепта
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeIngredientData"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeStepData"
    CreateRecipeData:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 32
          description: Название рецепта
        description:
          type: string
          nullable: true
          description: Описание рецепта
        cooking_time_min:
          type: integer
          exclusiveMinimum: 0
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          minimum: 0
          default: 4
          description: Количество порций
        is_public:
          type: boolean
          default: false
          description: Публичный рецепт
        picture_url:
          type: string
          nullable: true
          description: URL изображения рецепта
        source_url:
          type: string
          nullable: true
          description: URL источника рецепта
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeIngredientData"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeStepData"
    ProductResponse:
      type: object
      description: >
        Ответ для продуктов. measurementUnitId присутствует во всех эндпоинтах, кроме GET /products/{id}.
      required: [id, name, priceRub, priceQty, priceUnit, protein, fat, carbs, calories, isPublic, isOwn]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 128
        image:
          type: string
          nullable: true
        priceRub:
          type: number
          description: Цена продукта (поле price из таблицы products)
        priceQty:
          type: number
          description: Количество единиц, за которое указана цена (quantityPerPrice)
        priceUnit:
          type: string
          description: Аббревиатура основной единицы измерения (unitAbbr из measurement_units_ref)
        protein:
          type: number
          description: Белки на 100 г продукта
        fat:
          type: number
          description: Жиры на 100 г продукта
        carbs:
          type: number
          description: Углеводы на 100 г продукта
        calories:
          type: number
          description: Всегда 0 — поле отсутствует в схеме БД, зарезервировано
        isPublic:
          type: boolean
          description: Доступен ли продукт другим пользователям
        isOwn:
          type: boolean
          description: true — продукт принадлежит текущему пользователю, false — публичный чужой
        measurementUnitId:
          type: integer
          description: >
            ID основной единицы измерения (из measurement_units_ref).
            Присутствует в GET /products, GET /products/public, POST /products, PATCH /products/{id}.
            Отсутствует в GET /products/{id}.
        authorName:
          type: string
          description: Отображаемое имя пользователя, создавшего продукт
        createdAt:
          type: string
          format: date
          description: Дата создания продукта (YYYY-MM-DD)
        modifierName:
          type: string
          nullable: true
          description: Отображаемое имя последнего редактора (null — если продукт не редактировался)
        updatedAt:
          type: string
          format: date
          description: Дата последнего изменения продукта (YYYY-MM-DD)
        gMeasure:
          type: number
          nullable: true
          description: Масса в граммах, соответствующая базовой единице измерения (null — не задана)
        mlMeasure:
          type: number
          nullable: true
          description: Объём в миллилитрах, соответствующий gMeasure граммам (null — не задан)
        pcsMeasure:
          type: number
          nullable: true
          description: Количество штук, соответствующее gMeasure граммам (null — не задано)
    UserMe:
      type: object
      properties:
        login:
          type: string
          description: Логин пользователя
        name:
          type: string
          description: Отображаемое имя пользователя
    UpdateUserMe:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Новое отображаемое имя (без спецсимволов, кроме «-»)
    ChangePasswordData:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 1024
          description: Текущий пароль пользователя
        newPassword:
          type: string
          minLength: 8
          maxLength: 1024
          description: Новый пароль пользователя
