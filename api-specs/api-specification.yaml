openapi: 3.2.0
info:
  title: PumsemKitchen - Backend-API
  version: 0.0.1
paths:
  /auth/login:
    post:
      summary: Вход пользователя
      description: >
        Принимает логин и пароль. Проверяет наличие пользователя в БД и корректность пароля.
        После успешного входа устанавливает сессионную cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginData"
      responses:
        "200":
          description: Вход выполнен, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Неверный логин или пароль
        "422":
          description: Ошибка валидации входных данных
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      description: >
        Принимает логин, пароль и пригласительный код.
        Роль определяется по коду: INVITE_CODE → user, INVITE_CODE_ADMIN → admin.
        После успешной регистрации устанавливает сессионную cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterData"
      responses:
        "200":
          description: Пользователь зарегистрирован, сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Неверный пригласительный код
        "409":
          description: Пользователь с таким логином уже существует
        "422":
          description: Ошибка валидации входных данных
  /products/public:
    get:
      summary: Список публичных продуктов
      description: >
        Возвращает все продукты с флагом is_public = true.
        Не требует авторизации. isOwn всегда false.
        Дополнительно включает measurementUnitId, priceFromProductId, nutritionsFromProductId.
      responses:
        "200":
          description: Массив публичных продуктов
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ProductResponse"
                    - type: object
                      properties:
                        measurementUnitId:
                          type: integer
                          description: ID основной единицы измерения продукта
                        priceFromProductId:
                          type: integer
                          nullable: true
                          description: ID продукта-источника цены
                        nutritionsFromProductId:
                          type: integer
                          nullable: true
                          description: ID продукта-источника КБЖУ
        "401":
          description: Пользователь не авторизован
  /products:
    get:
      summary: Список продуктов пользователя
      description: >
        Возвращает все продукты, принадлежащие аутентифицированному пользователю (isOwn: true).
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Массив продуктов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
    post:
      summary: Создать продукт
      description: >
        Создаёт новый продукт для аутентифицированного пользователя.
        Если переданы g_measure, ml_measure или pcs_measure — записи добавляются в таблицу product_measures_in_units.
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Продукт создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "422":
          description: Ошибка валидации входных данных
  /products/{id}:
    get:
      summary: Получить продукт по ID
      description: >
        Возвращает продукт по его ID вместе с мерами конвертации.
        Пользователь может получить только свой продукт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      responses:
        "200":
          description: Данные продукта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к продукту
        "404":
          description: Продукт не найден
    patch:
      summary: Обновить продукт
      description: >
        Обновляет данные существующего продукта.
        Если переданы g_measure, ml_measure или pcs_measure — записи в product_measures_in_units создаются или обновляются.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Продукт обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Продукт не найден
        "422":
          description: Ошибка валидации входных данных
    delete:
      summary: Удалить продукт
      description: >
        Удаляет продукт по его ID. Пользователь может удалить только свой продукт.
        Если продукт используется как ингредиент хотя бы в одном рецепте, удаление отклоняется.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID продукта
      responses:
        "200":
          description: Продукт удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Продукт успешно удалён
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к продукту
        "404":
          description: Продукт не найден
        "409":
          description: Продукт используется в рецептах и не может быть удалён
  /recipes:
    get:
      summary: Список рецептов пользователя
      description: >
        Возвращает все рецепты, принадлежащие аутентифицированному пользователю.
        Сортировка по убыванию даты создания.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Массив рецептов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "401":
          description: Пользователь не авторизован
    post:
      summary: Создать рецепт
      description: >
        Создаёт новый рецепт с ингредиентами и шагами приготовления.
        Все три таблицы (recipes, ingredients, recipe_steps) заполняются атомарно в рамках одной транзакции.
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeData"
      responses:
        "200":
          description: Созданный рецепт с полными данными
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "422":
          description: Ошибка валидации входных данных
  /recipes/{id}:
    patch:
      summary: Обновить рецепт
      description: >
        Частично обновляет рецепт. Если переданы ingredients или steps — они заменяются целиком.
        Пользователь может редактировать только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeData"
      responses:
        "200":
          description: Обновлённый рецепт с полными данными
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
        "422":
          description: Ошибка валидации входных данных
    get:
      summary: Получить рецепт по ID
      description: >
        Возвращает полные данные рецепта: основную информацию, ингредиенты и шаги приготовления.
        Пользователь может получить только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Полные данные рецепта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
    delete:
      summary: Удалить рецепт
      description: >
        Удаляет рецепт по ID. Каскадно удаляет ингредиенты, шаги, оценки и связи с коллекциями.
        Пользователь может удалить только свой рецепт.
        Требует активной сессии (cookie).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Рецепт успешно удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Пользователь не авторизован
        "403":
          description: Нет доступа к рецепту
        "404":
          description: Рецепт не найден
  /users/me:
    get:
      summary: Профиль текущего пользователя
      description: >
        Возвращает логин и отображаемое имя аутентифицированного пользователя.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Данные текущего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
    patch:
      summary: Обновить имя текущего пользователя
      description: >
        Обновляет отображаемое имя аутентифицированного пользователя.
        Имя не должно превышать 32 символа и содержать спецсимволы, кроме «-».
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserMe"
      responses:
        "200":
          description: Обновлённые данные пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
        "422":
          description: Ошибка валидации входных данных
    delete:
      summary: Удалить аккаунт текущего пользователя
      description: >
        Удаляет аутентифицированного пользователя из системы и очищает сессию.
        Требует активной сессии (cookie).
      responses:
        "200":
          description: Аккаунт успешно удалён
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Пользователь не авторизован
  /users/me/password:
    patch:
      summary: Сменить пароль текущего пользователя
      description: >
        Проверяет совпадение currentPassword с паролем из БД.
        При совпадении заменяет пароль на newPassword (bcrypt, 10 раундов).
        Требует активной сессии (cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordData"
      responses:
        "200":
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Текущий пароль введён неверно
        "401":
          description: Пользователь не авторизован
        "404":
          description: Пользователь не найден
        "422":
          description: Ошибка валидации входных данных
  /measurements:
    get:
      summary: Список единиц измерения
      description: Возвращает все доступные единицы измерения из справочника.
      responses:
        "200":
          description: Список единиц измерения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementUnit"
        "401":
          description: Не авторизован
  /auth/logout:
    post:
      summary: Выход пользователя
      description: Очищает сессионную cookie на сервере.
      responses:
        "200":
          description: Сессия очищена
        "401":
          description: Нет активной сессии
components:
  schemas:
    LoginData:
      type: object
      required:
        - login
        - password
      properties:
        login:
          description: Логин пользователя (5–32 символа, только латинские буквы и цифры)
          type: string
          minLength: 5
          maxLength: 32
        password:
          description: Пароль пользователя (8–1024 символа)
          type: string
          minLength: 8
          maxLength: 1024
    UserResponse:
      type: object
      properties:
        userId:
          type: integer
        login:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
    RegisterData:
      type: object
      required:
        - login
        - password
        - inviteCode
      properties:
        login:
          description: Логин пользователя (5–32 символа, только латинские буквы и цифры)
          type: string
          minLength: 5
          maxLength: 32
        password:
          description: Пароль пользователя (8–1024 символа)
          type: string
          minLength: 8
          maxLength: 1024
        inviteCode:
          description: Пригласительный код (только буквы и цифры)
          type: string
    RegisterResponse:
      type: object
      properties:
        userId:
          type: integer
        login:
          type: string
        role:
          type: string
          enum: [user, admin]
    MeasurementUnit:
      type: object
      required: [measurement_unit_id, unit_name]
      properties:
        measurement_unit_id:
          type: integer
        unit_name:
          type: string
        unit_abbr:
          type: string
        measure_type:
          type: string
          enum: [piece, weight, volume]
        is_standart:
          type: boolean
    CreateProductRequest:
      type: object
      required:
        - title
        - proteins
        - fats
        - carbs
        - user_price
        - quantity_per_price
        - measurement_unit_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Название продукта
        proteins:
          type: number
          minimum: 0
          description: Белки на 100 г
        fats:
          type: number
          minimum: 0
          description: Жиры на 100 г
        carbs:
          type: number
          minimum: 0
          description: Углеводы на 100 г
        user_price:
          type: number
          minimum: 0
          description: Стоимость продукта
        quantity_per_price:
          type: number
          exclusiveMinimum: 0
          description: Количество единиц, за которое указана цена
        measurement_unit_id:
          type: integer
          description: ID единицы измерения из справочника
        family_id:
          type: integer
          description: ID семьи, которой принадлежит продукт. Если не указан — продукт принадлежит только пользователю
        g_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Масса продукта в граммах, соответствующая одной единице measurement_unit_id
        ml_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Объём продукта в миллилитрах, соответствующий одной единице measurement_unit_id
        pcs_measure:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Количество штук продукта, соответствующее одной единице measurement_unit_id
        is_public:
          type: boolean
          default: false
          description: Доступен ли продукт другим пользователям
    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 32
        description:
          type: string
          nullable: true
        cookingTimeMin:
          type: integer
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          description: Количество порций
        isPublic:
          type: boolean
          description: Доступен ли рецепт другим пользователям
        pictureUrl:
          type: string
          nullable: true
          description: URL изображения рецепта
        sourceUrl:
          type: string
          nullable: true
          description: Ссылка на источник рецепта
        createdAt:
          type: string
          format: date
        editedAt:
          type: string
          format: date
        authorName:
          type: string
          description: Имя владельца рецепта
    RecipeIngredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Название продукта
        note:
          type: string
          nullable: true
          description: Примечание к ингредиенту
        isOptional:
          type: boolean
          description: Является ли ингредиент необязательным
        amount:
          type: number
          description: Количество
        amountType:
          type: string
          description: Единица измерения
    RecipeStep:
      type: object
      properties:
        step:
          type: number
          description: Порядковый номер шага
        description:
          type: string
          description: Описание шага
        pictureUrl:
          type: string
          nullable: true
          description: URL изображения шага
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/Recipe"
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/RecipeIngredient"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/RecipeStep"
    CreateRecipeIngredientData:
      type: object
      required:
        - product_id
        - measurement_unit_id
        - quantity
      properties:
        product_id:
          type: integer
          description: ID продукта
        measurement_unit_id:
          type: integer
          description: ID единицы измерения
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Количество
        is_optional:
          type: boolean
          description: Необязательный ингредиент
        note:
          type: string
          maxLength: 128
          nullable: true
          description: Примечание к ингредиенту
    CreateRecipeStepData:
      type: object
      required:
        - order
        - description
      properties:
        order:
          type: integer
          exclusiveMinimum: 0
          description: Порядковый номер шага
        description:
          type: string
          minLength: 1
          description: Описание шага
        picture_url:
          type: string
          nullable: true
          description: URL изображения шага
    UpdateRecipeData:
      type: object
      description: Все поля опциональны. Переданные ingredients/steps заменяют существующие целиком.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 32
          description: Название рецепта
        description:
          type: string
          nullable: true
          description: Описание рецепта
        cooking_time_min:
          type: integer
          exclusiveMinimum: 0
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          minimum: 0
          description: Количество порций
        is_public:
          type: boolean
          description: Публичный рецепт
        picture_url:
          type: string
          nullable: true
          description: URL изображения рецепта
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeIngredientData"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeStepData"
    CreateRecipeData:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 32
          description: Название рецепта
        description:
          type: string
          nullable: true
          description: Описание рецепта
        cooking_time_min:
          type: integer
          exclusiveMinimum: 0
          nullable: true
          description: Время приготовления в минутах
        portions:
          type: integer
          minimum: 0
          default: 4
          description: Количество порций
        is_public:
          type: boolean
          default: false
          description: Публичный рецепт
        picture_url:
          type: string
          nullable: true
          description: URL изображения рецепта
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeIngredientData"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CreateRecipeStepData"
    ProductMeasure:
      type: object
      description: Запись конвертации из таблицы product_measures_in_units
      required: [unitId, unitName, unitAbbr]
      properties:
        unitId:
          type: integer
          description: ID единицы измерения
        unitName:
          type: string
          description: Полное название единицы измерения
        unitAbbr:
          type: string
          description: Аббревиатура единицы измерения
        amount:
          type: number
          nullable: true
          description: Количество данной единицы, эквивалентное одной основной единице продукта
    ProductResponse:
      type: object
      description: Ответ GET-запросов для продуктов
      required: [id, name, priceRub, priceQty, priceUnit, protein, fat, carbs, calories, isPublic, isOwn, measures]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 128
        image:
          type: string
          nullable: true
        priceRub:
          type: number
          description: Цена (userPrice, либо quantityPerPrice если userPrice не задан)
        priceQty:
          type: number
          description: Количество единиц, за которое указана цена (quantityPerPrice)
        priceUnit:
          type: string
          description: Аббревиатура основной единицы измерения (unitAbbr из measurement_units_ref)
        protein:
          type: number
          description: Белки на 100 г продукта
        fat:
          type: number
          description: Жиры на 100 г продукта
        carbs:
          type: number
          description: Углеводы на 100 г продукта
        calories:
          type: number
          description: Всегда 0 — поле отсутствует в схеме БД, зарезервировано
        isPublic:
          type: boolean
          description: Доступен ли продукт другим пользователям
        isOwn:
          type: boolean
          description: true — продукт принадлежит текущему пользователю, false — публичный чужой
        measures:
          type: array
          description: Конвертационные пропорции из product_measures_in_units
          items:
            $ref: "#/components/schemas/ProductMeasure"
    UserMe:
      type: object
      properties:
        login:
          type: string
          description: Логин пользователя
        name:
          type: string
          description: Отображаемое имя пользователя
    UpdateUserMe:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Новое отображаемое имя (без спецсимволов, кроме «-»)
    ChangePasswordData:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 1024
          description: Текущий пароль пользователя
        newPassword:
          type: string
          minLength: 8
          maxLength: 1024
          description: Новый пароль пользователя
